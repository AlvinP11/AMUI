name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build AMUI.exe
        shell: cmd
        run: build.bat

      - name: Show SHA-256
        shell: pwsh
        run: (Get-FileHash bin/AMUI.exe -Algorithm SHA256).Hash

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $hash = (Get-FileHash bin/AMUI.exe -Algorithm SHA256).Hash
          $notes = @(
            "Download **AMUI.exe** below, run it, then open as many Roblox clients as you want.",
            "",
            "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md) for what's new.",
            "",
            "**SHA-256:** ``$hash``",
            "",
            "Built by GitHub Actions from commit ${{ github.sha }}."
          ) -join "`n"
          gh release create "${{ github.ref_name }}" bin/AMUI.exe --title "AMUI ${{ github.ref_name }}" --notes "$notes"
