name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build AMUI.exe
        shell: cmd
        run: build.bat

      - name: Show SHA-256
        shell: pwsh
        run: (Get-FileHash bin/AMUI.exe -Algorithm SHA256).Hash

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $hash = (Get-FileHash bin/AMUI.exe -Algorithm SHA256).Hash
          $changelog = Get-Content CHANGELOG.md -Raw
          $section = [regex]::Match($changelog, "(?ms)^## " + [regex]::Escape($tag) + "\b[^\n]*\n(.*?)(?=^## |\z)")
          $whatsNew = if ($section.Success) { $section.Groups[1].Value.Trim() } else { "See CHANGELOG.md." }
          $notes = @(
            "## What's new",
            "",
            $whatsNew,
            "",
            "## Download",
            "",
            "Download **AMUI.exe** below and run it. No installer needed.",
            "",
            "**SHA-256:** ``$hash``",
            "",
            "Built by GitHub Actions from commit ${{ github.sha }}."
          ) -join "`n"
          gh release create "${{ github.ref_name }}" bin/AMUI.exe --title "AMUI ${{ github.ref_name }}" --notes "$notes"
